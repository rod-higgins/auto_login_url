services:
  auto_login_url.create:
    class: Drupal\auto_login_url\AutoLoginUrlCreate
    arguments:
      - '@database'
      - '@config.factory'
      - '@auto_login_url.general'
      - '@logger.factory'
      - '@auto_login_url.rate_limit'
      - '@request_stack'
    tags:
      - { name: backend_overridable }

  auto_login_url.login:
    class: Drupal\auto_login_url\AutoLoginUrlLogin
    arguments:
      - '@config.factory'
      - '@database'
      - '@auto_login_url.general'
      - '@user.authentication.cookie'
      - '@current_user'
      - '@logger.factory'
    tags:
      - { name: backend_overridable }

  auto_login_url.general:
    class: Drupal\auto_login_url\AutoLoginUrlGeneral
    arguments:
      - '@config.factory'
      - '@flood'
      - '@logger.factory'
      - '@request_stack'
      - '@entity_type.manager'
    tags:
      - { name: backend_overridable }

  auto_login_url.rate_limit:
    class: Drupal\auto_login_url\AutoLoginUrlRateLimit
    arguments:
      - '@config.factory'
      - '@state'
    tags:
      - { name: backend_overridable }