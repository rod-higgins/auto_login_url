auto_login_url.login:
  path: '/autologinurl/{uid}/{hash}'
  defaults:
    _controller: '\Drupal\auto_login_url\Controller\AutoLoginUrlMainController::login'
  requirements:
    _permission: 'use auto login url'
    uid: \d+
    hash: '[A-Za-z0-9_-]+'
  options:
    no_cache: TRUE

auto_login_url.settings:
  path: '/admin/people/autologinurl'
  defaults:
    _form: '\Drupal\auto_login_url\Form\ConfigForm'
    _title: 'Auto Login URL Settings'
  requirements:
    _permission: 'administer auto login url'

auto_login_url.health_check:
  path: '/admin/reports/auto-login-url/health'
  defaults:
    _controller: '\Drupal\auto_login_url\Controller\AutoLoginUrlMainController::healthCheck'
    _title: 'Auto Login URL Health Check'
  requirements:
    _permission: 'administer auto login url'