auto_login_url.settings:
  type: mapping
  label: 'Auto Login URL settings'
  mapping:
    secret:
      type: string
      label: 'Secret key for hash generation'
    expiration:
      type: integer
      label: 'Token expiration time in seconds'
    delete:
      type: boolean
      label: 'Delete tokens after use'
    token_length:
      type: integer
      label: 'Token length in characters'
    validate_ip_address:
      type: boolean
      label: 'Validate IP address on login'
    enable_usage_analytics:
      type: boolean
      label: 'Enable usage analytics tracking'
    max_urls_per_user_per_hour:
      type: integer
      label: 'Maximum URLs that can be created per user per hour'
    langcode:
      type: string
      label: 'Language code'
    _core:
      type: _core_config_info